name: iOS native build (UNSIGNED)

on:
  push:
  workflow_dispatch:
    inputs:
      signed_ipa:
        description: "Sign an iPhone IPA using the ios-signing environment"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve reviewed source tree or source bundle
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build/ci-logs"
          python3 - 2>&1 <<'PY' | tee "$GITHUB_WORKSPACE/build/ci-logs/source.log"
          import hashlib, os, pathlib, stat, tempfile, zipfile
          workspace = pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()
          if (workspace / 'FrameGuide.xcodeproj/project.pbxproj').is_file():
              root = workspace
              print('Source mode: full checkout; commit:', os.environ['GITHUB_SHA'])
          else:
              bundle = workspace / 'FrameGuide-Source.zip'
              print('Source mode: bundle; checkout:', os.environ['GITHUB_SHA'])
              print('FrameGuide-Source.zip SHA-256:', hashlib.sha256(bundle.read_bytes()).hexdigest())
              root = pathlib.Path(tempfile.mkdtemp(prefix='frameguide-source-', dir=os.environ['RUNNER_TEMP'])).resolve()
              roots = {'Core', 'FrameGuide', 'FrameGuide.xcodeproj', 'docs', 'scripts', '.github', 'README.md', '.gitignore'}
              denied = {'.git', '.superpowers', 'build', 'deriveddata', '.build', '.swiftpm', '__pycache__', 'xcuserdata', 'node_modules', '.cache', '.pytest_cache'}
              extensions = {'.ipa', '.dylib', '.p12', '.pfx', '.cer', '.pem', '.key', '.mobileprovision', '.provisionprofile', '.pyc', '.xcuserstate', '.xcscmblueprint', '.xccheckout', '.zip'}
              with zipfile.ZipFile(bundle) as archive:
                  members = archive.infolist()
                  if len(members) > 10000 or sum(m.file_size for m in members) > 100_000_000:
                      raise ValueError('Source bundle exceeds source-only limits')
                  seen = set()
                  for m in members:
                      p = pathlib.PurePosixPath(m.filename)
                      if (not m.filename or m.orig_filename != m.filename
                          or chr(92) in m.filename or ':' in m.filename or p.is_absolute()
                          or any(part in {'..', '.'} for part in m.filename.rstrip('/').split('/'))
                          or p.parts[0] not in roots or any(part.casefold() in denied or part == '.DS_Store'
                              or part == '.env' or part.startswith('.env.') for part in p.parts)
                          or p.suffix.lower() in extensions or stat.S_ISLNK(m.external_attr >> 16)):
                          raise ValueError(f'Unsafe source member: {m.filename}')
                      key = m.filename.rstrip('/').casefold()
                      if key in seen:
                          raise ValueError(f'Duplicate source member: {m.filename}')
                      seen.add(key)
                      target = root.joinpath(*p.parts)
                      if not target.resolve().is_relative_to(root):
                          raise ValueError('Source member escapes temporary root')
                  archive.extractall(root)
          required = [
                      'FrameGuide/AIComposition/AICompositionTypes.swift',
                      'FrameGuide/AIComposition/DeepSeekCompositionClient.swift',
                      'FrameGuide/AIComposition/APIKeyStore.swift',
                      'FrameGuide/AIComposition/SnapshotJPEGCodec.swift',
                      'FrameGuide/AIComposition/PreviewSnapshotProvider.swift',
                      'FrameGuide/AIComposition/AICompositionCoordinator.swift',
                      'FrameGuide/AIComposition/AICompositionPanel.swift',
                      'scripts/PhotoFixture.swift', 'scripts/AICompositionFixture.swift',
                      'FrameGuide/Resources/PrivacyInfo.xcprivacy',
                      'Core/Package.swift', 'Core/Sources/FrameGuideCore/CompositionEngine.swift',
                      'Core/Tests/FrameGuideCoreTests/CompositionEngineTests.swift',
                      'FrameGuide/App/FrameGuideApp.swift', 'FrameGuide/Resources/Info.plist',
                      'FrameGuide.xcodeproj/project.pbxproj',
                      'FrameGuide.xcodeproj/xcshareddata/xcschemes/FrameGuide.xcscheme',
                      'scripts/validate_project.py', 'scripts/package_source.ps1',
                      'README.md', 'docs/validation.md', 'docs/device-checklist.md', '.github/workflows/ios.yml']
          for relative in required:
              if not (root / relative).is_file():
                  raise ValueError(f'Missing source file: {relative}')
          outer_workflow = workspace / '.github/workflows/ios.yml'
          bundled_workflow = root / '.github/workflows/ios.yml'
          if outer_workflow.read_bytes() != bundled_workflow.read_bytes():
              raise ValueError('Outer workflow and source workflow differ; synchronize both before publishing')
          print('Workflow SHA-256:', hashlib.sha256(bundled_workflow.read_bytes()).hexdigest())
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'PROJECT_ROOT={root}\n')
          print('Project root:', root)
          PY

      - name: Select Xcode and record toolchain
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version 2>&1 | tee "$GITHUB_WORKSPACE/build/ci-logs/xcode-version.log"
          swift --version 2>&1 | tee "$GITHUB_WORKSPACE/build/ci-logs/swift-version.log"

      - name: Run Core SwiftPM tests
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail
          swift test --package-path Core 2>&1 | tee "$GITHUB_WORKSPACE/build/ci-logs/core-tests.log"

      - name: Exercise native JPEG rendering and framing
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail
          swiftc FrameGuide/Photo/PhotoFilter.swift FrameGuide/Photo/PhotoProcessor.swift scripts/PhotoFixture.swift -o "$RUNNER_TEMP/photo-fixture"
          "$RUNNER_TEMP/photo-fixture" 2>&1 | tee "$GITHUB_WORKSPACE/build/ci-logs/photo-fixture.log"

      - name: Exercise AI composition client snapshots and cancellation (offline fixtures)
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail
          swiftc -parse-as-library -swift-version 5 \
            Core/Sources/FrameGuideCore/Geometry.swift \
            Core/Sources/FrameGuideCore/CompositionTypes.swift \
            FrameGuide/AIComposition/AICompositionTypes.swift \
            FrameGuide/AIComposition/DeepSeekCompositionClient.swift \
            FrameGuide/AIComposition/APIKeyStore.swift \
            FrameGuide/AIComposition/SnapshotJPEGCodec.swift \
            FrameGuide/AIComposition/PreviewSnapshotProvider.swift \
            FrameGuide/AIComposition/AICompositionCoordinator.swift \
            scripts/AICompositionFixture.swift \
            -framework Foundation -framework CoreImage -framework CoreVideo \
            -framework ImageIO -framework Combine -framework Security \
            -o "$RUNNER_TEMP/ai-composition-fixture" 2>&1 | tee "$GITHUB_WORKSPACE/build/ci-logs/ai-composition-compile.log"
          "$RUNNER_TEMP/ai-composition-fixture" 2>&1 | tee "$GITHUB_WORKSPACE/build/ci-logs/ai-composition-fixture.log"

      - name: Validate project structure
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail
          python3 scripts/validate_project.py 2>&1 | tee "$GITHUB_WORKSPACE/build/ci-logs/project-validation.log"

      - name: Build simulator target (no simulator launch)
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail
          xcodebuild -project FrameGuide.xcodeproj -scheme FrameGuide -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$GITHUB_WORKSPACE/build/ci-logs/simulator-build.log"

      - name: Build device target without signing
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail
          xcodebuild -project FrameGuide.xcodeproj -scheme FrameGuide -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$GITHUB_WORKSPACE/build/ci-logs/device-build.log"

      - name: Package UNSIGNED device app
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail
          mkdir -p build/package/Payload
          cp -R build/device/Build/Products/Release-iphoneos/FrameGuide.app build/package/Payload/
          cd build/package
          zip -qr ../FrameGuide-UNSIGNED.ipa Payload
          echo '### FrameGuide-UNSIGNED.ipa — 未签名设备产物' >> "$GITHUB_STEP_SUMMARY"
          echo 'Requires your own valid signing before installation. This build does not verify simulator launch, iPhone installation or camera behavior.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload UNSIGNED device artifact (requires own signing)
        uses: actions/upload-artifact@v7
        with:
          name: FrameGuide-UNSIGNED-device-requires-signing
          path: ${{ env.PROJECT_ROOT }}/build/FrameGuide-UNSIGNED.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Preserve build logs including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: FrameGuide-native-build-logs
          path: ${{ github.workspace }}/build/ci-logs
          if-no-files-found: warn
          retention-days: 14

  sign-device-ipa:
    name: Sign iPhone IPA for registered devices
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.signed_ipa == true && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: macos-15-intel
    environment:
      name: ios-signing
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve source bundle
        run: |
          set -euo pipefail
          python3 - 2>&1 <<'PY' | tee "$RUNNER_TEMP/sign-source.log"
          import os, pathlib, stat, tempfile, zipfile
          workspace = pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()
          if (workspace / 'FrameGuide.xcodeproj/project.pbxproj').is_file():
              root = workspace
          else:
              bundle = workspace / 'FrameGuide-Source.zip'
              if not bundle.is_file():
                  raise FileNotFoundError('FrameGuide-Source.zip is missing')
              root = pathlib.Path(tempfile.mkdtemp(prefix='frameguide-sign-source-', dir=os.environ['RUNNER_TEMP'])).resolve()
              roots = {'Core', 'FrameGuide', 'FrameGuide.xcodeproj', 'docs', 'scripts', '.github', 'README.md', '.gitignore'}
              denied = {'.git', '.superpowers', 'build', 'deriveddata', '.build', '.swiftpm', '__pycache__', 'xcuserdata', 'node_modules', '.cache', '.pytest_cache'}
              extensions = {'.ipa', '.dylib', '.p12', '.pfx', '.cer', '.pem', '.key', '.mobileprovision', '.provisionprofile', '.pyc', '.xcuserstate', '.xcscmblueprint', '.xccheckout', '.zip'}
              with zipfile.ZipFile(bundle) as archive:
                  members = archive.infolist()
                  if len(members) > 10000 or sum(member.file_size for member in members) > 100_000_000:
                      raise ValueError('Source bundle exceeds source-only limits')
                  seen = set()
                  for member in members:
                      name = member.filename
                      path = pathlib.PurePosixPath(name)
                      if (not name or member.orig_filename != name or chr(92) in name or ':' in name or path.is_absolute()
                          or any(part in {'..', '.'} for part in name.rstrip('/').split('/'))
                          or path.parts[0] not in roots or any(part.casefold() in denied or part == '.DS_Store' or part == '.env' or part.startswith('.env.') for part in path.parts)
                          or path.suffix.lower() in extensions or stat.S_ISLNK(member.external_attr >> 16)):
                          raise ValueError(f'Unsafe source member: {name}')
                      key = name.rstrip('/').casefold()
                      if key in seen:
                          raise ValueError(f'Duplicate source member: {name}')
                      seen.add(key)
                      destination = root.joinpath(*path.parts)
                      if not destination.resolve().is_relative_to(root):
                          raise ValueError('Source member escapes temporary root')
                  archive.extractall(root)
          required = ['FrameGuide.xcodeproj/project.pbxproj', 'FrameGuide.xcodeproj/xcshareddata/xcschemes/FrameGuide.xcscheme', 'FrameGuide/Resources/Info.plist', 'FrameGuide/Resources/PrivacyInfo.xcprivacy']
          for relative in required:
              if not (root / relative).is_file():
                  raise ValueError(f'Missing source file: {relative}')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'PROJECT_ROOT={root}\n')
          print('Resolved reviewed source for signed build.')
          PY

      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Import signing material and validate profile
        env:
          IOS_SIGNING_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_SIGNING_CERTIFICATE_P12_BASE64 }}
          IOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.IOS_SIGNING_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          : "${IOS_SIGNING_CERTIFICATE_P12_BASE64:?Missing ios-signing environment secret IOS_SIGNING_CERTIFICATE_P12_BASE64}"
          : "${IOS_SIGNING_CERTIFICATE_PASSWORD:?Missing ios-signing environment secret IOS_SIGNING_CERTIFICATE_PASSWORD}"
          : "${IOS_PROVISIONING_PROFILE_BASE64:?Missing ios-signing environment secret IOS_PROVISIONING_PROFILE_BASE64}"
          KEYCHAIN_PATH="$RUNNER_TEMP/frameguide-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERT_PATH="$RUNNER_TEMP/frameguide-signing.p12"
          PROFILE_PATH="$RUNNER_TEMP/frameguide.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/frameguide-profile.plist"
          printf '%s' "$IOS_SIGNING_CERTIFICATE_P12_BASE64" | base64 -D > "$CERT_PATH"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$IOS_SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          python3 - "$PROFILE_PLIST" <<'PY'
          import datetime, os, plistlib, sys
          with open(sys.argv[1], 'rb') as source:
              profile = plistlib.load(source)
          bundle_id = 'app.frameguide.personal'
          team_ids = profile.get('TeamIdentifier') or []
          app_id = (profile.get('Entitlements') or {}).get('application-identifier', '')
          devices = profile.get('ProvisionedDevices') or []
          expiration = profile.get('ExpirationDate')
          name = profile.get('Name', '')
          if not team_ids or not app_id.endswith('.' + bundle_id):
              raise SystemExit('Provisioning profile must match app.frameguide.personal and its signing team.')
          if not devices:
              raise SystemExit('Provisioning profile must include the registered iPhone device.')
          if isinstance(expiration, datetime.datetime) and expiration.tzinfo is None:
              expiration = expiration.replace(tzinfo=datetime.timezone.utc)
          if not isinstance(expiration, datetime.datetime) or expiration <= datetime.datetime.now(datetime.timezone.utc):
              raise SystemExit('Provisioning profile is expired or has no valid expiration date.')
          if not name or any(char in name for char in '\r\n='):
              raise SystemExit('Provisioning profile has an invalid name.')
          development = (profile.get('Entitlements') or {}).get('get-task-allow') is True
          identity = 'Apple Development' if development else 'Apple Distribution'
          method = 'development' if development else 'ad-hoc'
          print('Provisioning profile is valid for', bundle_id, 'with', len(devices), 'registered device(s).')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('APP_BUNDLE_ID=' + bundle_id + '\n')
              env.write('TEAM_ID=' + team_ids[0] + '\n')
              env.write('PROFILE_UUID=' + profile['UUID'] + '\n')
              env.write('PROFILE_NAME=' + name + '\n')
              env.write('CODE_SIGN_IDENTITY=' + identity + '\n')
              env.write('EXPORT_METHOD=' + method + '\n')
          PY
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          PROFILE_GET_TASK_ALLOW=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$PROFILE_PLIST" 2>/dev/null || true)
          if [[ "$PROFILE_GET_TASK_ALLOW" == "true" ]]; then
            EXPECTED_IDENTITY_PREFIX='Apple Development:'
          else
            EXPECTED_IDENTITY_PREFIX='Apple Distribution:'
          fi
          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -Fq "$EXPECTED_IDENTITY_PREFIX"; then
            echo "Imported certificate does not match profile type ($EXPECTED_IDENTITY_PREFIX)." >&2
            exit 1
          fi

      - name: Archive signed iPhone app
        run: |
          set -euo pipefail
          xcodebuild -project "$PROJECT_ROOT/FrameGuide.xcodeproj" -scheme FrameGuide \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/FrameGuide.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/FrameGuide-derived" \
            CODE_SIGN_STYLE=Manual CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
            archive 2>&1 | tee "$RUNNER_TEMP/frameguide-signed-archive.log"

      - name: Export and verify signed IPA
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, plistlib
          options = {
              'method': os.environ['EXPORT_METHOD'],
              'signingStyle': 'manual',
              'teamID': os.environ['TEAM_ID'],
              'provisioningProfiles': {os.environ['APP_BUNDLE_ID']: os.environ['PROFILE_NAME']},
              'destination': 'export',
          }
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'FrameGuide-ExportOptions.plist'), 'wb') as output:
              plistlib.dump(options, output)
          PY
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/FrameGuide.xcarchive" \
            -exportPath "$RUNNER_TEMP/FrameGuide-export" \
            -exportOptionsPlist "$RUNNER_TEMP/FrameGuide-ExportOptions.plist" \
            2>&1 | tee "$RUNNER_TEMP/frameguide-signed-export.log"
          IPA="$RUNNER_TEMP/FrameGuide-export/FrameGuide.ipa"
          test -s "$IPA"
          mkdir -p "$RUNNER_TEMP/FrameGuide-ipa-check"
          ditto -x -k "$IPA" "$RUNNER_TEMP/FrameGuide-ipa-check"
          APP="$RUNNER_TEMP/FrameGuide-ipa-check/Payload/FrameGuide.app"
          test -d "$APP"
          test -f "$APP/embedded.mobileprovision"
          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          test "$APP_ID" = "$APP_BUNDLE_ID"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo '### Signed development/ad hoc IPA' >> "$GITHUB_STEP_SUMMARY"
          echo 'The exported IPA includes a valid code signature and provisioning profile for registered devices. Enable Developer Mode on the iPhone before installing.' >> "$GITHUB_STEP_SUMMARY"
          echo "$IPA" > "$RUNNER_TEMP/frameguide-signed-ipa-path.txt"

      - name: Upload signed iPhone IPA
        uses: actions/upload-artifact@v7
        with:
          name: FrameGuide-SIGNED-device
          path: ${{ runner.temp }}/FrameGuide-export/FrameGuide.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing material
        if: always()
        run: |
          set +e
          security delete-keychain "$RUNNER_TEMP/frameguide-signing.keychain-db" >/dev/null 2>&1
          rm -f "$RUNNER_TEMP/frameguide-signing.p12" "$RUNNER_TEMP/frameguide.mobileprovision" \
            "$RUNNER_TEMP/frameguide-profile.plist" "$RUNNER_TEMP/FrameGuide-ExportOptions.plist" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
